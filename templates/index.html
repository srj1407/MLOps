<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Eligibility Prediction App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h3>Loan Eligibility Predictor</h3>
                    </div>
                    <div class="card-body">
                        <form action="/predict" method="POST">
                            <div class="mb-3">
                                <label for="income" class="form-label">Annual Income ($)</label>
                                <input type="number" class="form-control" id="income" name="income" required placeholder="e.g. 65000">
                            </div>
                            <div class="mb-3">
                                <label for="credit_score" class="form-label">Credit Score</label>
                                <input type="number" class="form-control" id="credit_score" name="credit_score" required placeholder="e.g. 720">
                            </div>
                            <div class="mb-3">
                                <label for="loan_amount" class="form-label">Loan Amount Requested ($)</label>
                                <input type="number" class="form-control" id="loan_amount" name="loan_amount" required placeholder="e.g. 20000">
                            </div>
                            <div class="mb-3">
                                <label for="employment_status" class="form-label">Employment Status</label>
                                <select class="form-select" id="employment_status" name="employment_status" required>
                                    <option value="1">Employed</option>
                                    <option value="0">Unemployed / Self-Employed</option>
                                </select>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Check Eligibility</button>
                            </div>
                        </form>

                        {% if prediction_text %}
                            <div class="alert mt-4 text-center {{ 'alert-success' if is_approved else 'alert-danger' }}" role="alert">
                                <strong>{{ prediction_text }}</strong>
                            </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
